name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            Please review this pull request. This is a Next.js frontend project. Focus on:
            - Correctness: logic bugs, broken edge cases, missing error boundaries
            - Next.js specifics: correct use of Server vs Client Components, data fetching patterns (fetch caching, revalidation), proper use of metadata API, route handlers, and middleware
            - React: unnecessary re-renders, missing keys, stale closures, improper hook usage
            - Accessibility: missing ARIA attributes, poor keyboard navigation, inadequate color contrast
            - Performance: large bundle imports, missing next/image or next/font, layout shift causes
            - Type safety: unsafe `any` casts, missing null checks at data boundaries
            - Security: XSS vectors, exposed secrets, unvalidated user input rendered as HTML
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model claude-sonnet-4-6 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
