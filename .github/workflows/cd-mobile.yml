name: Build Mobile (Preview Mode for Staging)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Detect changed paths
        id: filter
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -qE '^(apps/mobile/|packages/|turbo\.json|package\.json|pnpm-lock\.yaml)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.result == 'success' && needs.changes.outputs.mobile == 'true')
    # TODO: add iOS once Apple Developer Program membership is acquired ($99/year);
    # free Apple ID has no developer team, EAS cannot provision iOS builds without it.
    name: Build APK (local)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: '20.x'
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: apps/mobile
        run: eas build --local --platform android --profile preview --non-interactive

      - uses: actions/upload-artifact@v4
        with:
          name: app-preview
          path: apps/mobile/**/*.apk
          if-no-files-found: error
