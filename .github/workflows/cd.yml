name: Deploy — Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Amplify (staging)
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Cancel any in-progress Amplify deployment
        run: |
          aws amplify list-jobs \
            --app-id "${{ secrets.AMPLIFY_APP_ID }}" \
            --branch-name main \
            --query 'jobSummaries[?status==`RUNNING`||status==`PENDING`||status==`PROVISIONING`||status==`CANCELLING`].jobId' \
            --output text \
            | tr '\t' '\n' \
            | while read -r JOB; do
                [[ -z "$JOB" || "$JOB" == "None" ]] && continue
                echo "Stopping in-progress job: $JOB"
                aws amplify stop-job \
                  --app-id "${{ vars.AMPLIFY_APP_ID }}" \
                  --branch-name main \
                  --job-id "$JOB"
              done

      - name: Trigger Amplify build
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name main \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Wait for Amplify deployment to complete
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if ! STATUS=$(aws amplify get-job \
              --app-id "${{ vars.AMPLIFY_APP_ID }}" \
              --branch-name main \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text 2>&1); then
              echo "Failed to get Amplify deployment status: $STATUS"
              exit 1
            fi
            echo "Status: $STATUS"
            case "$STATUS" in
              SUCCEED)  echo "Deployment succeeded."; exit 0 ;;
              FAILED)   echo "Deployment failed.";    exit 1 ;;
              CANCELLING|CANCELLED) echo "Deployment cancelled."; exit 1 ;;
            esac
            echo "Still in progress — waiting 30s ($i/60)"
            sleep 30
          done
          echo "Timed out waiting for deployment after 30 minutes."
          exit 1
